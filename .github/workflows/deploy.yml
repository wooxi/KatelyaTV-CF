name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Pages bundle
        run: pnpm run pages:build
        env:
          NEXT_PUBLIC_STORAGE_TYPE: d1
          NEXT_PUBLIC_SITE_NAME: KatelyaTV
          NEXT_PUBLIC_IMAGE_PROXY: /api/image-proxy?url=
          NEXTAUTH_URL: ${{ vars.NEXTAUTH_URL || 'https://katelyatv-ap4.pages.dev' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=katelyatv --branch=main
